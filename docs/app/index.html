  <body>
    <div id="root"></div>
    <script>
      // Registered only on the deployed web app. Inside the Capacitor iOS/Android
      // shells the scheme is capacitor:// or https://localhost and a service worker
      // is neither needed nor wanted.
      var nativeShell = location.protocol === 'capacitor:' ||
        (location.protocol === 'https:' && location.hostname === 'localhost');
      if ('serviceWorker' in navigator && nativeShell) {
        // Older Android releases registered a web cache at https://localhost.
        // Remove only generated app caches; measurement history stays intact.
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          return Promise.all(registrations.map(function (registration) {
            return registration.unregister();
          })).then(function () {
            return window.caches ? caches.keys().then(function (keys) {
              return Promise.all(keys.filter(function (key) {
                return key.indexOf('phvd-') === 0;
              }).map(function (key) { return caches.delete(key); }));
            }) : null;
          }).then(function () {
            if (registrations.length) location.reload();
          });
        }).catch(function () {});
      } else if ('serviceWorker' in navigator && location.protocol === 'https:') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(() => {});
        });
      }
    </script>
