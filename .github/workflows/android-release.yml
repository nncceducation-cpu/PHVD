name: Android build (signed .aab + .apk)

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Version code (integer, must be higher than the last Play upload)"
        required: true
        default: "8"
      version_name:
        description: "Version name shown to users"
        required: true
        default: "1.6"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build the web bundle
        run: npm run build

      - name: Generate the native Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Generate the Android icon set
        run: npx capacitor-assets generate --android || echo "icon generation skipped"

      - name: Patch android/ for a signed Play release
        env:
          ANDROID_VERSION_CODE: ${{ github.event.inputs.version_code }}
          ANDROID_VERSION_NAME: ${{ github.event.inputs.version_name }}
        run: python3 scripts/patch-android.py

      - name: Restore the signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/release.keystore"
          SIZE=$(wc -c < "$RUNNER_TEMP/signing/release.keystore")
          echo "keystore restored: ${SIZE} bytes"
          test "$SIZE" -gt 1000 || { echo "::error::keystore looks truncated"; exit 1; }
          echo "KEYSTORE_PATH=$RUNNER_TEMP/signing/release.keystore" >> "$GITHUB_ENV"

      - name: Build the signed App Bundle and APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          # .aab is what Play wants; the .apk is so it can be sideloaded and tested
          # on a real handset without going through Play at all.
          ./gradlew --no-daemon bundleRelease assembleRelease

      - name: Verify the signature
        run: |
          set -euo pipefail
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$AAB" || { echo "::error::no .aab produced"; exit 1; }
          test -f "$APK" || { echo "::error::no .apk produced"; exit 1; }

          echo "--- .aab"
          ls -la "$AAB"
          # An unsigned bundle has no META-INF/*.RSA - Play would reject it, so fail here instead.
          unzip -l "$AAB" | grep -qi "META-INF/.*\.\(RSA\|EC\|DSA\)" \
            || { echo "::error::the .aab is NOT signed"; exit 1; }
          echo "aab is signed"

          echo "--- .apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Rename the artifacts
        run: |
          set -euo pipefail
          V="${{ github.event.inputs.version_name }}-${{ github.event.inputs.version_code }}"
          mkdir -p out
          cp android/app/build/outputs/bundle/release/app-release.aab "out/PHVD-${V}.aab"
          cp android/app/build/outputs/apk/release/app-release.apk    "out/PHVD-${V}.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: phvd-android
          path: out/*
          if-no-files-found: error
