name: Publish the web app to docs/app

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/app/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - name: Refresh docs/app from the fresh build
        run: |
          rm -rf docs/app
          mkdir -p docs/app
          cp -r dist/. docs/app/
      - name: Commit the rebuilt app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/app
          if git diff --cached --quiet; then
            echo "docs/app already current"
          else
            git commit -m "Rebuild the published web app"
            git push
          fi
