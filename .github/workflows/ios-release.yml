name: iOS build & upload to App Store Connect

# You are on Windows. This workflow rents a macOS machine from GitHub, builds the
# signed .ipa there, and uploads it to App Store Connect / TestFlight.
# Trigger it manually from the Actions tab, or by pushing a v* tag.
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number (must be higher than the last upload)'
        required: true
        default: '1'
  push:
    tags: ['v*']

env:
  SCHEME: App
  BUNDLE_ID: com.khorshidmohammad.phvd

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install JS deps and build web assets
        run: |
          npm ci
          npm run build

      - name: Generate / sync the native iOS project
        run: |
          if [ ! -d "ios" ]; then npx cap add ios; fi

          # Strip signing off every Pods target. Otherwise the embedded Capacitor
          # frameworks carry a provisioning-profile setting and export fails with
          # "CapacitorApp.framework does not support provisioning profiles" (build #7).
          # Unsigned here is correct: the app's [CP] Embed Pods Frameworks phase re-signs
          # them with the app's identity. This is the standard CocoaPods arrangement.
          if ! grep -q CODE_SIGNING_ALLOWED ios/App/Podfile; then
          cat >> ios/App/Podfile <<'PODEOF'

          post_install do |installer|
            assertDeploymentTarget(installer)
            installer.pods_project.targets.each do |t|
              t.build_configurations.each do |c|
                c.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ''
                c.build_settings['CODE_SIGN_IDENTITY'] = ''
                c.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                c.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                c.build_settings['EXPANDED_CODE_SIGN_IDENTITY'] = ''
              end
            end
          end
          PODEOF
          echo "Podfile: signing disabled on Pods targets"
          fi
          echo "--- Podfile ---"; cat ios/App/Podfile; echo "---------------"

          npx cap sync ios

      - name: Generate app icons and splash screens
        run: npx @capacitor/assets generate --ios

      - name: Set version and build number
        run: |
          BUILD_NO="${{ github.event.inputs.build_number || github.run_number }}"
          cd ios/App
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.0" App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NO" App/Info.plist || true
          plutil -p App/Info.plist | grep -E 'CFBundle(Version|ShortVersionString)'

      # --- Code signing -------------------------------------------------------
      # Requires these repo secrets (Settings > Secrets and variables > Actions):
      #   BUILD_CERTIFICATE_BASE64   Apple Distribution .p12, base64-encoded
      #   P12_PASSWORD               password for that .p12
      #   PROVISIONING_PROFILE_BASE64  App Store provisioning profile, base64
      #   KEYCHAIN_PASSWORD          any random string
      #   ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_BASE64   App Store Connect API key (.p8)
      #   APPLE_TEAM_ID              10-char team ID
      - name: Install signing certificate and profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/cert.p12
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERT_PATH
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o $PROFILE_PATH

          # macOS's keychain cannot import a PKCS#12 encrypted with PBES2/AES-256,
          # which is what OpenSSL 3 produces by default. It reports this as
          # "Unknown format in import". Re-export the bundle here, on the runner,
          # in the legacy 3DES format the keychain understands. The runner has
          # OpenSSL 3 WITH the legacy provider; a stock Windows box does not.
          OSSL="$(brew --prefix openssl@3 2>/dev/null)/bin/openssl"
          [ -x "$OSSL" ] || OSSL="$(command -v openssl)"
          echo "using: $OSSL ($($OSSL version))"

          LEGACY_P12=$RUNNER_TEMP/legacy.p12
          "$OSSL" pkcs12 -in $CERT_PATH -passin pass:"$P12_PASSWORD" -nodes \
            -out $RUNNER_TEMP/bundle.pem
          "$OSSL" pkcs12 -export -legacy -in $RUNNER_TEMP/bundle.pem \
            -passout pass:"$P12_PASSWORD" -out $LEGACY_P12
          rm -f $RUNNER_TEMP/bundle.pem
          echo "re-exported in keychain-compatible format:"
          "$OSSL" pkcs12 -in $LEGACY_P12 -info -noout -passin pass:"$P12_PASSWORD" 2>&1 | grep -iE "MAC:|Encrypted"

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $LEGACY_P12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PROFILE_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      # xcodebuild needs an "account" to do automatic signing. On a CI runner there is
      # no Apple ID signed into Xcode -- but the App Store Connect API key works as one.
      # This is why build #3 said "No Accounts".
      - name: Set up App Store Connect API key for xcodebuild
        env:
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
          RAW_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          RAW_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          RAW_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Strip any stray whitespace. A trailing space in ASC_ISSUER_ID made Apple's
          # auth call fail (DVTPortalResponseError on listTeams) in build #5.
          KEY_ID=$(printf '%s' "$RAW_KEY_ID"    | tr -d '[:space:]')
          ISSUER=$(printf '%s' "$RAW_ISSUER_ID" | tr -d '[:space:]')
          TEAM=$(printf   '%s' "$RAW_TEAM_ID"   | tr -d '[:space:]')

          mkdir -p ~/private_keys
          echo -n "$ASC_KEY_BASE64" | base64 --decode -o ~/private_keys/AuthKey_$KEY_ID.p8

          echo "ASC_KEY_PATH=$HOME/private_keys/AuthKey_$KEY_ID.p8" >> $GITHUB_ENV
          echo "ASC_KEY_ID_CLEAN=$KEY_ID"   >> $GITHUB_ENV
          echo "ASC_ISSUER_CLEAN=$ISSUER"   >> $GITHUB_ENV
          echo "TEAM_ID_CLEAN=$TEAM"        >> $GITHUB_ENV

          echo "key id length:  ${#KEY_ID}  (expect 10)"
          echo "issuer length:  ${#ISSUER}  (expect 36)"
          echo "team id length: ${#TEAM}    (expect 10)"

      - name: Configure manual signing on the App target only
        run: |
          # Automatic signing tries to mint a *Development* profile, which needs a
          # registered device ("your team has no devices") -- build #6. We are building
          # for the App Store and already have a Distribution profile, so use manual
          # signing. It must be set on the App target ONLY: putting it on the xcodebuild
          # command line applies it to the Pods frameworks too, which reject provisioning
          # profiles -- build #4.
          PROFILE_NAME=$(security cms -D -i $RUNNER_TEMP/profile.mobileprovision \
            | plutil -extract Name raw -)
          echo "profile name: $PROFILE_NAME"

          gem list -i xcodeproj >/dev/null 2>&1 || sudo gem install xcodeproj --no-document

          ruby - "$PROFILE_NAME" "$TEAM_ID_CLEAN" <<'RUBY'
          require 'xcodeproj'
          profile_name, team = ARGV
          project = Xcodeproj::Project.open('ios/App/App.xcodeproj')
          target  = project.targets.find { |t| t.name == 'App' } or abort('App target not found')
          target.build_configurations.each do |c|
            c.build_settings['CODE_SIGN_STYLE']               = 'Manual'
            c.build_settings['DEVELOPMENT_TEAM']              = team
            c.build_settings['PROVISIONING_PROFILE_SPECIFIER']= profile_name
            c.build_settings['CODE_SIGN_IDENTITY']            = 'Apple Distribution'
            c.build_settings['CODE_SIGN_IDENTITY[sdk=iphoneos*]'] = 'Apple Distribution'
          end
          project.save
          puts "App target set to Manual / #{profile_name} / #{team}"
          RUBY

      - name: Write ExportOptions.plist
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>signingStyle</key><string>manual</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>TEAM_ID_PLACEHOLDER</string>
            <key>uploadSymbols</key><true/>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.khorshidmohammad.phvd</key><string>PROFILE_NAME_PLACEHOLDER</string>
            </dict>
          </dict>
          </plist>
          PLIST
          PROFILE_NAME=$(security cms -D -i $RUNNER_TEMP/profile.mobileprovision | plutil -extract Name raw -)
          sed -i '' "s/TEAM_ID_PLACEHOLDER/$TEAM_ID_CLEAN/" $RUNNER_TEMP/ExportOptions.plist
          sed -i '' "s/PROFILE_NAME_PLACEHOLDER/$PROFILE_NAME/" $RUNNER_TEMP/ExportOptions.plist
          cat $RUNNER_TEMP/ExportOptions.plist

      - name: Archive
        run: |
          # No signing settings here on purpose -- they now live on the App target only.
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            PRODUCT_BUNDLE_IDENTIFIER=$BUNDLE_ID \
            archive

      - name: Export .ipa
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export

      - uses: actions/upload-artifact@v4
        with:
          name: phvd-ipa
          path: ${{ runner.temp }}/export/*.ipa

      # This step SUBMITS the build to App Store Connect (TestFlight).
      # It does not release to the public App Store — you still press
      # "Submit for Review" yourself in App Store Connect.
      - name: Upload to App Store Connect
        run: |
          xcrun altool --upload-app -f "$RUNNER_TEMP/export/App.ipa" -t ios \
            --apiKey "$ASC_KEY_ID_CLEAN" --apiIssuer "$ASC_ISSUER_CLEAN"

      - name: Clean up keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
