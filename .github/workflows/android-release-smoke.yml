name: Test an existing signed Android release

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Android release workflow run containing the signed app and test APKs"
        required: true
        default: "38501119165"

permissions:
  contents: read
  actions: read

jobs:
  release-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@v4
        with:
          name: phvd-android
          path: out
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test the existing signed optimized release
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/android/run-release-smoke.sh
      - name: Preserve release smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phvd-android-smoke-api-${{ matrix.api-level }}
          path: smoke-results/
          if-no-files-found: error
